<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISAI — Poster para Espejo (A4)</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  @page {
    size: A4 portrait;
    margin: 0;
  }

  @media print {
    body {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .print-instructions {
      display: none !important;
    }
  }

  :root {
    --bg-deep: #0f0f1a;
    --bg-card: #1a1a2e;
    --gold: #d4a853;
    --gold-light: #e8c97a;
    --gold-dark: #b8923e;
    --white: #ffffff;
    --gray: #888888;
    --gray-light: #aaaaaa;
  }

  body {
    background: #2a2a3a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 20px;
  }

  .print-instructions {
    color: var(--gray-light);
    font-size: 13px;
    margin-bottom: 20px;
    text-align: center;
  }

  /* ── Poster ── */
  .poster {
    width: 210mm;
    height: 297mm;
    background: linear-gradient(170deg, #1a1a2e 0%, #0f0f1a 35%, #12122a 65%, #0f0f1a 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 18mm 16mm;
  }

  /* ── Ambient glow effects ── */
  .poster::before {
    content: '';
    position: absolute;
    top: -80mm;
    left: 50%;
    transform: translateX(-50%);
    width: 200mm;
    height: 200mm;
    background: radial-gradient(ellipse, rgba(212, 168, 83, 0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .poster::after {
    content: '';
    position: absolute;
    bottom: -40mm;
    left: 50%;
    transform: translateX(-50%);
    width: 180mm;
    height: 120mm;
    background: radial-gradient(ellipse, rgba(212, 168, 83, 0.04) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── Top Section ── */
  .poster-top {
    text-align: center;
    z-index: 1;
    width: 100%;
  }

  .poster-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 900;
    font-size: 18mm;
    letter-spacing: 8px;
    color: var(--white);
    margin-bottom: 3mm;
  }

  .poster-logo span {
    color: var(--gold);
  }

  .poster-logo-underline {
    width: 40mm;
    height: 0.6mm;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 5mm;
  }

  .poster-subtitle-small {
    font-size: 4mm;
    color: var(--gray);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ── Center Section ── */
  .poster-center {
    z-index: 1;
    text-align: center;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8mm;
  }

  .headline {
    font-family: 'Syne', sans-serif;
    font-weight: 900;
    font-size: 14mm;
    color: var(--white);
    line-height: 1.15;
    max-width: 170mm;
    letter-spacing: -0.3mm;
  }

  .headline em {
    font-style: normal;
    color: var(--gold);
  }

  .subheadline {
    font-size: 5.5mm;
    color: var(--gray-light);
    font-weight: 400;
    line-height: 1.5;
    max-width: 150mm;
  }

  /* ── Face SVG ── */
  .face-container {
    position: relative;
    width: 80mm;
    height: 95mm;
    margin: 4mm 0;
  }

  .face-svg {
    width: 100%;
    height: 100%;
  }

  /* ── Bottom Section ── */
  .poster-bottom {
    z-index: 1;
    text-align: center;
    width: 100%;
  }

  .bottom-divider {
    width: 60mm;
    height: 0.4mm;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 6mm;
  }

  .cta-text {
    font-size: 5.5mm;
    color: var(--white);
    font-weight: 600;
    margin-bottom: 4mm;
    letter-spacing: 0.3mm;
  }

  .discount-large {
    display: inline-block;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--bg-deep);
    font-family: 'Syne', sans-serif;
    font-weight: 900;
    font-size: 9mm;
    padding: 3mm 10mm;
    border-radius: 2mm;
    letter-spacing: 0.5mm;
    margin-bottom: 5mm;
  }

  .bottom-url {
    font-family: 'Syne', sans-serif;
    font-size: 7mm;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
  }

  /* ── Decorative border ── */
  .border-frame {
    position: absolute;
    top: 8mm;
    left: 8mm;
    right: 8mm;
    bottom: 8mm;
    border: 0.3mm solid rgba(212, 168, 83, 0.12);
    border-radius: 3mm;
    pointer-events: none;
    z-index: 0;
  }

  .corner-diamond {
    position: absolute;
    width: 4mm;
    height: 4mm;
    border: 0.4mm solid var(--gold);
    transform: rotate(45deg);
    opacity: 0.25;
  }
  .corner-diamond.tl { top: 6mm; left: 6mm; }
  .corner-diamond.tr { top: 6mm; right: 6mm; }
  .corner-diamond.bl { bottom: 6mm; left: 6mm; }
  .corner-diamond.br { bottom: 6mm; right: 6mm; }

  @media print {
    body {
      background: white;
      padding: 0;
    }
  }
</style>
</head>
<body>

<p class="print-instructions">Poster A4 para espejo de barberia. Imprimir en A4 a color.</p>

<div class="poster">
  <div class="border-frame"></div>
  <div class="corner-diamond tl"></div>
  <div class="corner-diamond tr"></div>
  <div class="corner-diamond bl"></div>
  <div class="corner-diamond br"></div>

  <!-- ── TOP ── -->
  <div class="poster-top">
    <div class="poster-logo">VIS<span>AI</span></div>
    <div class="poster-logo-underline"></div>
    <div class="poster-subtitle-small">Inteligencia Artificial para tu Estilo</div>
  </div>

  <!-- ── CENTER ── -->
  <div class="poster-center">
    <div class="headline">&iquest;Que corte<br>te queda <em>mejor</em>?</div>

    <div class="face-container">
      <svg class="face-svg" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Face silhouette -->
        <ellipse cx="100" cy="110" rx="62" ry="80" stroke="#d4a853" stroke-width="1.2" opacity="0.5" fill="none"/>

        <!-- Jawline -->
        <path d="M38 110 Q38 165 65 190 Q80 205 100 210 Q120 205 135 190 Q162 165 162 110"
              stroke="#d4a853" stroke-width="0.8" opacity="0.3" fill="none"/>

        <!-- Horizontal proportion lines -->
        <line x1="30" y1="75" x2="170" y2="75" stroke="#d4a853" stroke-width="0.4" opacity="0.2" stroke-dasharray="3,3"/>
        <line x1="30" y1="110" x2="170" y2="110" stroke="#d4a853" stroke-width="0.4" opacity="0.2" stroke-dasharray="3,3"/>
        <line x1="30" y1="145" x2="170" y2="145" stroke="#d4a853" stroke-width="0.4" opacity="0.2" stroke-dasharray="3,3"/>
        <line x1="30" y1="175" x2="170" y2="175" stroke="#d4a853" stroke-width="0.4" opacity="0.2" stroke-dasharray="3,3"/>

        <!-- Vertical center line -->
        <line x1="100" y1="25" x2="100" y2="220" stroke="#d4a853" stroke-width="0.4" opacity="0.2" stroke-dasharray="3,3"/>

        <!-- Vertical side lines -->
        <line x1="60" y1="50" x2="60" y2="200" stroke="#d4a853" stroke-width="0.3" opacity="0.12" stroke-dasharray="2,4"/>
        <line x1="140" y1="50" x2="140" y2="200" stroke="#d4a853" stroke-width="0.3" opacity="0.12" stroke-dasharray="2,4"/>

        <!-- Eyes -->
        <ellipse cx="78" cy="105" rx="12" ry="5" stroke="#d4a853" stroke-width="0.8" opacity="0.4" fill="none"/>
        <ellipse cx="122" cy="105" rx="12" ry="5" stroke="#d4a853" stroke-width="0.8" opacity="0.4" fill="none"/>
        <circle cx="78" cy="105" r="2.5" fill="#d4a853" opacity="0.3"/>
        <circle cx="122" cy="105" r="2.5" fill="#d4a853" opacity="0.3"/>

        <!-- Eyebrows -->
        <path d="M64 92 Q78 85 92 92" stroke="#d4a853" stroke-width="0.7" opacity="0.3" fill="none"/>
        <path d="M108 92 Q122 85 136 92" stroke="#d4a853" stroke-width="0.7" opacity="0.3" fill="none"/>

        <!-- Nose -->
        <path d="M100 100 L100 135 Q95 142 88 142" stroke="#d4a853" stroke-width="0.7" opacity="0.3" fill="none"/>
        <path d="M100 135 Q105 142 112 142" stroke="#d4a853" stroke-width="0.7" opacity="0.3" fill="none"/>

        <!-- Lips -->
        <path d="M82 160 Q92 153 100 157 Q108 153 118 160" stroke="#d4a853" stroke-width="0.7" opacity="0.35" fill="none"/>
        <path d="M82 160 Q100 170 118 160" stroke="#d4a853" stroke-width="0.5" opacity="0.25" fill="none"/>

        <!-- Measurement arrows / analysis indicators -->
        <circle cx="100" cy="65" r="3" stroke="#d4a853" stroke-width="0.6" opacity="0.4" fill="none"/>
        <text x="100" y="67" text-anchor="middle" fill="#d4a853" font-size="5" opacity="0.4" font-family="Outfit, sans-serif">1</text>

        <circle cx="170" cy="105" r="3" stroke="#d4a853" stroke-width="0.6" opacity="0.4" fill="none"/>
        <text x="170" y="107" text-anchor="middle" fill="#d4a853" font-size="5" opacity="0.4" font-family="Outfit, sans-serif">2</text>

        <circle cx="100" cy="220" r="3" stroke="#d4a853" stroke-width="0.6" opacity="0.4" fill="none"/>
        <text x="100" y="222" text-anchor="middle" fill="#d4a853" font-size="5" opacity="0.4" font-family="Outfit, sans-serif">3</text>

        <circle cx="30" cy="105" r="3" stroke="#d4a853" stroke-width="0.6" opacity="0.4" fill="none"/>
        <text x="30" y="107" text-anchor="middle" fill="#d4a853" font-size="5" opacity="0.4" font-family="Outfit, sans-serif">4</text>

        <!-- Diagonal analysis lines -->
        <line x1="38" y1="55" x2="100" y2="110" stroke="#d4a853" stroke-width="0.3" opacity="0.12" stroke-dasharray="2,3"/>
        <line x1="162" y1="55" x2="100" y2="110" stroke="#d4a853" stroke-width="0.3" opacity="0.12" stroke-dasharray="2,3"/>
        <line x1="100" y1="110" x2="65" y2="190" stroke="#d4a853" stroke-width="0.3" opacity="0.12" stroke-dasharray="2,3"/>
        <line x1="100" y1="110" x2="135" y2="190" stroke="#d4a853" stroke-width="0.3" opacity="0.12" stroke-dasharray="2,3"/>

        <!-- Hair outline suggestion -->
        <path d="M38 100 Q30 60 55 40 Q75 25 100 22 Q125 25 145 40 Q170 60 162 100"
              stroke="#d4a853" stroke-width="0.6" opacity="0.2" fill="none" stroke-dasharray="4,2"/>

        <!-- Scanning effect lines -->
        <line x1="20" y1="90" x2="180" y2="90" stroke="#d4a853" stroke-width="0.3" opacity="0.08"/>
        <line x1="20" y1="120" x2="180" y2="120" stroke="#d4a853" stroke-width="0.3" opacity="0.08"/>
        <line x1="20" y1="150" x2="180" y2="150" stroke="#d4a853" stroke-width="0.3" opacity="0.08"/>

        <!-- Corner brackets -->
        <path d="M25 40 L25 30 L35 30" stroke="#d4a853" stroke-width="0.8" opacity="0.3" fill="none"/>
        <path d="M175 40 L175 30 L165 30" stroke="#d4a853" stroke-width="0.8" opacity="0.3" fill="none"/>
        <path d="M25 210 L25 220 L35 220" stroke="#d4a853" stroke-width="0.8" opacity="0.3" fill="none"/>
        <path d="M175 210 L175 220 L165 220" stroke="#d4a853" stroke-width="0.8" opacity="0.3" fill="none"/>

        <!-- AI scan label -->
        <rect x="140" y="28" width="38" height="10" rx="2" fill="#d4a853" opacity="0.15"/>
        <text x="159" y="35" text-anchor="middle" fill="#d4a853" font-size="5.5" opacity="0.5" font-family="Montserrat, sans-serif" font-weight="700">AI SCAN</text>
      </svg>
    </div>

    <div class="subheadline">
      La IA analiza tu cara y te recomienda<br>el corte perfecto
    </div>
  </div>

  <!-- ── BOTTOM ── -->
  <div class="poster-bottom">
    <div class="bottom-divider"></div>
    <div class="cta-text">Pidele a tu barbero el codigo de descuento</div>
    <div class="discount-large">&minus;4&#8364; en tu analisis</div>
    <br>
    <div class="bottom-url">visai.es</div>
  </div>
</div>

</body>
</html>
