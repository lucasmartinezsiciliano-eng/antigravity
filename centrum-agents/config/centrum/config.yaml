# ───────────────────────────────────────────────────────────────────
# Perfil Hermes: centrum
# Orquestador principal del sistema Centrum de la Vivienda.
# Mariano lo usa vía Telegram. Delega en sub-agentes especialistas.
# ───────────────────────────────────────────────────────────────────

model:
  default: "gemma-4-31B-it"
  provider: "openai"              # vLLM expone endpoint OpenAI-compatible
  base_url: "http://localhost:8003/v1"
  context_length: 131072          # debe coincidir con --max-model-len en vllm-load-max.sh
  # NOTA: thinking mode desactivado por defecto en vLLM (--default-chat-template-kwargs)
  # Para tareas de análisis puro (sin tools), activar per-request via extra_body
  extra_body:
    temperature: 1.0              # Google recomienda 1.0 para Gemma 4 (no 0.7)
    top_p: 0.95
    top_k: 64
    # ORDEN DE SAMPLERS OBLIGATORIO — sin esto los defaults de vLLM dan resultados inconsistentes
    # PENDIENTE DE DECISIÓN: migrar este perfil a Qwen 3.6 35B-A3B FP8 (puerto 8003)
    # Benchmarks: 28-30 tok/s vs 7 tok/s Gemma 31B dense, TAU2 81.2 vs 76.9, agentic-coding 70.6 vs 41.6

terminal:
  backend: "local"
  timeout: 180

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20

agent:
  max_turns: 90
  api_max_retries: 3
  reasoning_effort: "medium"
  tool_use_enforcement: "auto"

delegation:
  model: ""                       # sub-agentes heredan gemma-4-31B por defecto
  provider: "openai"
  base_url: "http://localhost:8003/v1"
  max_concurrent_children: 3
  max_spawn_depth: 2              # orquestador → director → especialista
  orchestrator_enabled: true

display:
  language: "es"
  tool_progress: "all"
  show_cost: true
  platforms:
    telegram:
      tool_progress: "verbose"

security:
  tirith_enabled: true
  redact_secrets: true

approvals:
  mode: "smart"                   # pide confirmación en acciones de alto impacto
                                  # (envío email/WhatsApp, modificación caso, cierre, etc.)

# Kanban — pipeline durable de casos (SQLite, sobrevive reinicios DGX)
# delegate_task = subtareas cortas en sesión | Kanban = casos multi-día, con humano en loop
kanban:
  orchestrator_profile: "centrum"
  auto_decompose: false            # el orquestador descompone manualmente para control total
  dispatch_interval_seconds: 60
  failure_limit: 2                 # 2 fallos → auto-block → Mariano interviene
  auxiliary:
    kanban_decomposer:
      provider: "openai"
      base_url: "http://localhost:8003/v1"
      model: "gemma-4-31B-it"

# Skills cargadas siempre en este perfil
skills:
  active:
    - governance/guardrails
    - centrum/3-reglas
    - centrum/8-estrategias
    - centrum/perfil-deudor
    - centrum/clasificacion-ae
    - centrum/case-kanban           # cómo gestionar casos como cards Kanban
    - centrum/thinking-mode         # cuándo activar razonamiento profundo sin tools

# Tools habilitadas
tools:
  filesystem:
    enabled: true
    allowed_paths:
      - "~/.hermes/profiles/centrum/cases"
      - "~/.hermes/profiles/centrum/memories"
      - "~/.hermes/profiles/centrum/workspace"
      - "/tmp/centrum-*"
  telegram:
    enabled: true
  delegation:
    enabled: true
  web_search:
    enabled: false                # no necesario en el orchestrator
  web_fetch:
    enabled: true
    # Sub-agentes llaman APIs externas directamente — sin n8n intermediario
    allowed_domains:
      - "graph.facebook.com"          # IG DM + Graph API (dm-qualifier, auto-responder)
      - "open.tiktokapis.com"          # TikTok DM API (dm-qualifier)
      - "api.twilio.com"               # WhatsApp (whatsapp-sender, previa aprobación)
      - "smtp.gmail.com"               # Email Centrum (email-sender)
      - "www.googleapis.com"           # Google Calendar (call-prep)

# Gateway Telegram para Mariano
gateway:
  telegram:
    enabled: true
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"
    admin_chat_id_env: "TELEGRAM_CHAT_ID_LUCAS"
